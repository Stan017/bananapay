# Railway usa Nixpacks para buildear el proyecto.
# Forzamos Python — sin esto nixpacks elige Node.js por el package.json de Playwright.

providers = ["python"]

[phases.setup]
aptPkgs = ["libzbar0", "libzbar-dev"]   # zbar para pyzbar — apt en imagen Ubuntu de Railway

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2"
