<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Depósitos — BananaPay Admin</title>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>

<div class="header">
  <span class="header-logo">🍌 BananaPay</span>
  <span class="header-user" id="operator-name"></span>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
    <button class="logout-btn" onclick="logout()">Salir</button>
  </div>
</div>

<nav class="nav">
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="deposits.html" class="active">📥 Depósitos</a>
  <a href="withdrawals.html">📤 Retiros</a>
  <a href="users.html">👥 Usuarios</a>
  <a href="history.html">📋 Historial</a>
  <a href="support.html">🆘 Soporte</a>
  <a href="fraud.html">🚨 Fraude</a>
</nav>

<div class="page">
  <p class="section-title">Depósitos pendientes</p>
  <div id="deposits-list">
    <p class="empty">Cargando...</p>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
  const op = JSON.parse(localStorage.getItem("bp_operator") || "{}");
  const nameEl = document.getElementById("operator-name");
  if (nameEl) nameEl.textContent = op.name || "";
  initTheme();
  loadDeposits();
  startPolling();
</script>
</body>
</html>
