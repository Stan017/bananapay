<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alertas de Fraude — BananaPay Admin</title>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>

<div class="header">
  <span class="header-logo">🍌 BananaPay</span>
  <span class="header-user" id="operator-name"></span>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
    <button class="logout-btn" onclick="logout()">Salir</button>
  </div>
</div>

<nav class="nav">
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="deposits.html">📥 Depósitos</a>
  <a href="withdrawals.html">📤 Retiros</a>
  <a href="users.html">👥 Usuarios</a>
  <a href="history.html">📋 Historial</a>
  <a href="support.html">🆘 Soporte</a>
  <a href="fraud.html" class="active">🚨 Fraude</a>
</nav>

<div class="page">
  <p class="section-title">Alertas de fraude abiertas</p>
  <div id="fraud-list">
    <p class="empty">Cargando...</p>
  </div>

  <!-- Blacklist -->
  <p class="section-title" style="margin-top:32px">🚫 Blacklist</p>
  <div class="config-card">
    <div class="bl-add-form">
      <input id="bl-phone"  type="text" placeholder="Teléfono (+593...)" class="config-input" style="width:180px;text-align:left" />
      <input id="bl-cedula" type="text" placeholder="Cédula (opcional)"  class="config-input" style="width:160px;text-align:left" />
      <input id="bl-reason" type="text" placeholder="Motivo del bloqueo" class="config-input" style="width:220px;text-align:left;flex:1" />
      <button class="btn btn-reject" onclick="addBlacklist()" style="white-space:nowrap">🚫 Bloquear</button>
    </div>
    <div id="blacklist-list" style="margin-top:12px">
      <p class="empty">Cargando...</p>
    </div>
  </div>

  <!-- Configuración de límites -->
  <p class="section-title" style="margin-top:32px">⚙️ Límites de detección</p>
  <div class="config-card" id="fraud-config-card">
    <p class="empty">Cargando configuración...</p>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
  const op = JSON.parse(localStorage.getItem("bp_operator") || "{}");
  const nameEl = document.getElementById("operator-name");
  if (nameEl) nameEl.textContent = op.name || "";
  initTheme();
  loadFraud();
  loadBlacklist();
  loadFraudConfig();
  startPolling();
</script>
</body>
</html>
