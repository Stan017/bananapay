<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BananaPay Admin</title>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>

<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">🍌</div>
    <div class="login-title">BananaPay Admin</div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required placeholder="admin@bananapay.ec" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <div class="form-group">
        <label for="pin">PIN</label>
        <input type="password" id="pin" inputmode="numeric" maxlength="6" required placeholder="••••" />
      </div>
      <div class="error-msg" id="login-error"></div>
      <button class="btn btn-primary" id="btn-login" type="submit">Entrar</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script>
  // Si ya está logueado, redirigir al dashboard
  if (isLoggedIn()) window.location.href = "dashboard.html";
</script>
</body>
</html>
