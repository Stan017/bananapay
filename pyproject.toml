[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bananapay"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "redis[asyncio]>=5.1",
    "httpx>=0.27",
    "bcrypt>=4.2",
    "PyJWT>=2.9",
    "sentry-sdk[fastapi]>=2.16",
    "supabase>=2.7",
    "anthropic>=0.40",
    "tronpy>=0.4",
    "cryptography>=42.0",
    "qrcode[pil]>=8.0",
    "Pillow>=10.0",
    "pyzbar>=0.1.9",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
